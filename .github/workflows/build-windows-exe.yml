name: Bouw Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Haal projectbestanden op
        uses: actions/checkout@v4

      - name: Zet Python klaar op de bouwserver
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer bouwpakketten op de bouwserver
        run: python -m pip install -r requirements.txt

      - name: Bouw de Windows-app
        run: python -m PyInstaller --onefile --noconsole --name NEN3140_Aanwijzingen --icon assets/eqraft_icon.ico --add-data 'templates;templates' --add-data 'assets;assets' main.py

      - name: Controleer het resultaat
        shell: pwsh
        run: |
          if (-not (Test-Path dist/NEN3140_Aanwijzingen.exe)) {
            throw 'Windows-exe ontbreekt na de build.'
          }

      - name: Test de gebouwde exe en het Word-sjabloon
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\NEN3140_Aanwijzingen.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Controle van de exe is mislukt (exitcode $($process.ExitCode))."
          }

      - name: Test het venster en alle rolkeuzes
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\NEN3140_Aanwijzingen.exe -ArgumentList '--ui-smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Het venster kon niet starten (exitcode $($process.ExitCode))."
          }

      - name: Leg een schermafbeelding van het venster vast
        shell: pwsh
        run: |
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $app = Start-Process -FilePath .\dist\NEN3140_Aanwijzingen.exe -PassThru
            Start-Sleep -Seconds 4
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $drawing = [System.Drawing.Graphics]::FromImage($bitmap)
            $drawing.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save('ui-preview.png')
            $drawing.Dispose()
            $bitmap.Dispose()
          } catch {
            Write-Host "Schermafbeelding niet beschikbaar: $_"
          } finally {
            if ($app) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Maak de schermafbeelding downloadbaar
        uses: actions/upload-artifact@v4
        with:
          name: interface-controle
          path: ui-preview.png
          if-no-files-found: ignore

      - name: Maak exe downloadbaar
        uses: actions/upload-artifact@v4
        with:
          name: NEN3140_Aanwijzingen-Windows
          path: dist/NEN3140_Aanwijzingen.exe
          if-no-files-found: error
